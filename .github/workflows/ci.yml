name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository hygiene
        run: python3 tools/check_repo_hygiene.py

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build and test engine (dev, sanitizers)
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev

      - name: Build and test engine (release)
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release

      - uses: astral-sh/setup-uv@v5

      - name: Python lint and tests
        env:
          DEEPQUAKE_REQUIRE_SIM: "1"
        run: |
          uv sync --locked
          # CPU-only PyTorch, so the training tests run here too (the locked
          # 'train' extra would download several GB of CUDA libraries).
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install onnxruntime onnx
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pytest -m "not gamedata and not gpu"
