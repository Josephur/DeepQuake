# The six-type roster run (#56): one shared policy for the Grunt, the Dog,
# the Enforcer, the Ogre, the Hell Knight and the Shalrath, warm started from
# the five-type roster model. The trunk and the recurrent core are shared;
# the monster type comes in as a one-hot appended to the observation
# (deepquake.monster.MONSTER_TYPES), and each type has its own policy head,
# so one ONNX model can drive a mixed level.
#
# Reward: "damage" (the #51 fix) - the dense (dealt - taken)/100 per-step term
# is what keeps the Dog committing to closing.
#
# Maps: the union of the class pools (the previous nine plus e2m6/e4m6/e4m7,
# the Shalrath's stocked maps with room to spare - e4m7 has 10 of them, e4m6
# 9, e2m6 2; the other Shalrath maps are already in the pool or held out).
# Held out: e3m1 (since #48), e3m2 (the Ogre's, #53), e3m6 (the Hell
# Knight's, #55) and e4m8 (4 Shalraths, the Shalrath's held-out map).
#   uv run python -m deepquake.train_monster configs/roster8_shalrath.toml
name = "roster8_shalrath"
monsters = [
  "monster_army",
  "monster_dog",
  "monster_enforcer",
  "monster_ogre",
  "monster_hell_knight",
  "monster_shalrath",
]
# The four-type roster checkpoint: its GRU, its policy heads and its value
# head are copied, the new type column is zeroed, so the shared network
# starts out playing exactly like the released model. The Hell Knight's head
# starts from the last source head (the Ogre's), which init_from does by
# index.
init_from = "runs/roster7_hknight/checkpoint.pt"
# The Shalrath is a projectile shooter; its head starts from the Enforcer's
# head - the #55 finding (a matched head cleared the bar within the standard
# budget where the default last-head rule bought only parity).
init_head_from = { monster_shalrath = "monster_enforcer" }
maps = [
  "e1m1", "e2m1", "e4m1", "e1m2", "e2m2", "e4m2", "e2m3", "e2m5", "e4m5",
  "e2m6", "e4m6", "e4m7",
]
held_out = ["e3m1", "e3m2", "e3m6", "e4m8"]
envs = 12
opponents = [
  { kind = "shooter" },
  { kind = "random" },
  { kind = "trained", checkpoint = "runs/combat_grunt_fightstart/checkpoint.pt" },
]
skills = [0, 1, 2, 3]
styles = [
  { style = [1.0, 0.0, 0.0] },
  { style = [0.0, 1.0, 0.0] },
  { style = [0.0, 0.0, 1.0] },
  { style = [0.5, 0.5, 0.5] },
]
reward = "damage"
seed = 0
total_steps = 10000000
device = "3090"
timeout_steps = 600
checkpoint_every = 25

[ppo]
steps_per_env = 256
epochs = 4
minibatches = 4
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
entropy_coef = 0.01
hidden = 256
bptt = 32
