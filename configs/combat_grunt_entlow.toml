# PPO tuning, single variable 1/3 (#38): entropy_coef 0.01 -> 0.001.
# Same task and everything else as combat_grunt_only (sparse reward,
# 200-600 units, LOS-broken, 600-decision timeout, current action
# layout). Its entropy pinned near the 6.63 maximum from ~3M steps on,
# after a transient dip to ~2.8 around 2M: the hypothesis is that the
# entropy bonus holds the policy near-uniform (fire head ~50/50, hence
# the measured ~55% blind-fire rate) and a 10x cut lets it commit.
# Parity bar on the fixed 200 Grunt tasks: shooter 23.0%, random 13.5%.
#   uv run python -m deepquake.train_combat configs/combat_grunt_entlow.toml
name = "combat_grunt_entlow"
map = "e1m1"
monster = "monster_army"
reward = "sparse"
seed = 0
envs = 8
total_steps = 10000000
device = "3090"
timeout_steps = 600
checkpoint_every = 25

[ppo]
steps_per_env = 256
epochs = 4
minibatches = 4
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
entropy_coef = 0.001
hidden = 256
bptt = 32
