[project]
name = "deepquake"
version = "0.1.0"
description = "Neural-network brains for Quake's monsters"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
train = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "torch>=2.4",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/deepquake"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra --strict-markers"
markers = [
  "gamedata: needs the user's Quake data in gamedata/id1 (deselected in CI)",
  "gpu: needs a CUDA GPU (deselected in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]
extend-exclude = ["engine/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
